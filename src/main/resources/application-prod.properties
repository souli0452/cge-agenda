# ============================================
# PROFIL PRODUCTION
# Activer avec : --spring.profiles.active=prod (ou SPRING_PROFILES_ACTIVE=prod)
# Surcharge application.properties — ne redéfinit que ce qui doit changer en prod.
# ============================================

# Pas de SQL en clair dans les logs en production (perf + confidentialité des données)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs applicatifs réduits au nécessaire
logging.level.gov.bf.ascelc.cge_agenda=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Documentation API désactivée en production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origine du frontend en production (le dev garde localhost via la valeur par défaut)
app.cors.allowed-origins=https://agenda.asce-lc.bf
