<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Événement reporté</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #1f2937; -webkit-font-smoothing: antialiased; }
        .wrapper { max-width: 560px; margin: 32px auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
        .topbar { height: 4px; background: #b45309; }
        .header { padding: 28px 32px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f1f3; }
        .header img { height: 36px; width: auto; }
        .header .org { font-size: 13px; font-weight: 600; color: #6b7280; letter-spacing: .2px; }
        .content { padding: 28px 32px; }
        .label { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 16px; background: #fef3e2; color: #b45309; }
        h1 { font-size: 19px; font-weight: 700; color: #111827; margin-bottom: 14px; line-height: 1.35; }
        .lead { font-size: 15px; line-height: 1.65; color: #374151; margin-bottom: 24px; white-space: pre-line; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .info-table td { padding: 10px 0; font-size: 14px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table td:first-child { color: #6b7280; width: 38%; font-weight: 500; padding-right: 12px; }
        .info-table td:last-child { color: #111827; font-weight: 500; }
        .footer { padding: 20px 32px; border-top: 1px solid #f0f1f3; text-align: center; }
        .footer p { font-size: 11.5px; color: #9ca3af; line-height: 1.7; }
        .footer .brand { font-weight: 600; color: #6b7280; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="topbar"></div>
    <div class="header">
        <img th:src="'cid:logo'" alt="ASCE-LC"/>
        <span class="org">CGE Agenda — ASCE-LC</span>
    </div>
    <div class="content">
        <span class="label">Report</span>
        <h1>Un événement a été reporté</h1>
        <p class="lead" th:text="${customMessage}"></p>

        <table class="info-table">
            <tr><td>Titre</td><td th:text="${event.title}"></td></tr>
            <tr><td>Nouvelle date de début</td><td th:text="${#temporals.format(event.startDate, 'dd MMMM yyyy', #locale)}"></td></tr>
            <tr><td>Nouvelle date de fin</td><td th:text="${#temporals.format(event.endDate, 'dd MMMM yyyy', #locale)}"></td></tr>
        </table>

        <p style="font-size:13.5px;color:#6b7280;">Merci de mettre à jour votre agenda personnel en conséquence.</p>
    </div>
    <div class="footer">
        <p class="brand">CGE Agenda — ASCE-LC</p>
        <p>Ceci est un email automatique, merci de ne pas y répondre.</p>
    </div>
</div>
</body>
</html>
