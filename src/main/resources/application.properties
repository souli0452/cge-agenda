# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bdagendatest}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=CGEAgendaPool

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERVER
# ============================================
server.port=8081
server.servlet.context-path=/

server.compression.enabled=true
server.compression.mime-types=application/json,application/pdf,text/html
server.compression.min-response-size=1024

# ============================================
# MAIL
# ============================================
spring.mail.host=mailer.gov.bf
spring.mail.port=587
spring.mail.username=agenda@asce-lc.bf
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
app.upload.dir=uploads

# ============================================
# LOGGING
# ============================================
logging.level.gov.bf.ascelc.cge_agenda=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql=TRACE

# ============================================
# KEYCLOAK / OAUTH2
# ============================================
# issuer-uri doit correspondre exactement au claim "iss" des jetons émis (donc à l'URL
# publique de Keycloak vue par le navigateur) ; jwk-set-uri peut pointer vers l'adresse
# interne (réseau Docker) pour la récupération des clés, indépendamment du reverse proxy.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/asce-lc-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/asce-lc-realm/protocol/openid-connect/certs}

keycloak.realm=asce-lc-realm
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
keycloak.resource=cge-agenda-client
keycloak.public-client=true

# Fichier local optionnel et non commité (voir .gitignore), pour les secrets réels
spring.config.import=optional:classpath:application-secrets.properties

# Compte de service dédié à l'administration Keycloak (gestion utilisateurs/rôles)
# Le secret réel vient de application-secrets.properties (dev local, gitignored)
# ou de la variable d'environnement KEYCLOAK_ADMIN_CLIENT_SECRET (autres environnements).
keycloak.admin.server-url=${keycloak.auth-server-url}
keycloak.admin.realm=${keycloak.realm}
keycloak.admin.client-id=cge-agenda-admin-service
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# ============================================
# SAUVEGARDES BASE DE DONNÉES
# ============================================
app.backup.dir=backups
pg.dump.path=${PG_DUMP_PATH:pg_dump}
pg.restore.path=${PG_RESTORE_PATH:pg_restore}

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# Le schéma existant (dev/prod déjà en service) a été géré par Hibernate ddl-auto
# jusqu'ici : on le marque comme baseline "version 0" pour que Flyway prenne le relais
# sans tenter de le reconstruire. V0__baseline_schema.sql porte volontairement la version
# 0 (= baseline-version) : elle est donc ignorée sur une base déjà baselinée (dev/prod
# existantes), mais s'exécute normalement sur une base neuve (aucun historique Flyway),
# ce qui permet de construire le schéma complet dès l'installation initiale.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ============================================
# ENCODING
# ============================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ============================================
# URLS APPLICATIVES
# ============================================
app.base-url=http://localhost:4200

app.api-url=http://localhost:8081

# ============================================
# ASYNC / THREADS
# ============================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-