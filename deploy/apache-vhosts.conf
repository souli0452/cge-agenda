# À coller dans le fichier de vhosts Apache de WAMP
# (WampServer : conf/extra/httpd-vhosts.conf, inclus par défaut depuis httpd.conf).
#
# Pré-requis, à activer via le menu WampServer (icône barre des tâches) :
#   Apache > Modules Apache > proxy_module
#   Apache > Modules Apache > proxy_http_module
#   Apache > Modules Apache > headers_module
#   Apache > Modules Apache > ssl_module (déjà actif si le Laravel existant tourne en HTTPS)
# Puis redémarrer les services WampServer.
#
# Certificat SSL : si le certificat existant pour le Laravel est un wildcard
# (*.asce-lc.bf), réutiliser les mêmes SSLCertificateFile/SSLCertificateKeyFile
# ci-dessous. Sinon, il faut un certificat par sous-domaine (ex. via Let's Encrypt/win-acme)
# pour agenda.asce-lc.bf et auth.asce-lc.bf.

# ============================================
# agenda.asce-lc.bf -> frontend (Angular/Nginx), /api/* -> backend (Spring Boot)
# ============================================
<VirtualHost *:80>
    ServerName agenda.asce-lc.bf
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName agenda.asce-lc.bf

    SSLEngine on
    SSLCertificateFile      "C:/wamp64/bin/apache/conf/ssl/agenda.asce-lc.bf.crt"
    SSLCertificateKeyFile   "C:/wamp64/bin/apache/conf/ssl/agenda.asce-lc.bf.key"
    # SSLCertificateChainFile "C:/wamp64/bin/apache/conf/ssl/agenda.asce-lc.bf.chain.crt"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # L'API doit être proxyfiée AVANT le reste (ordre important : préfixe le plus
    # spécifique en premier), tout le reste part vers le frontend.
    ProxyPass        /api/ http://127.0.0.1:18081/api/
    ProxyPassReverse /api/ http://127.0.0.1:18081/api/

    ProxyPass        / http://127.0.0.1:18040/
    ProxyPassReverse / http://127.0.0.1:18040/
</VirtualHost>

# ============================================
# auth.asce-lc.bf -> Keycloak
# ============================================
<VirtualHost *:80>
    ServerName auth.asce-lc.bf
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName auth.asce-lc.bf

    SSLEngine on
    SSLCertificateFile      "C:/wamp64/bin/apache/conf/ssl/auth.asce-lc.bf.crt"
    SSLCertificateKeyFile   "C:/wamp64/bin/apache/conf/ssl/auth.asce-lc.bf.key"
    # SSLCertificateChainFile "C:/wamp64/bin/apache/conf/ssl/auth.asce-lc.bf.chain.crt"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:18080/
    ProxyPassReverse / http://127.0.0.1:18080/
</VirtualHost>
