services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agenda_cge}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env}
    volumes:
      # PostgreSQL 18+ attend un montage sur /var/lib/postgresql (pas .../data) pour
      # la mise en page de répertoire compatible pg_ctlcluster.
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build: ./keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.asce-lc.bf}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis dans .env}
    volumes:
      # Import automatique du realm au premier démarrage (n'écrase rien si le realm existe déjà)
      - ./deploy/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: ["start", "--optimized", "--import-realm"]
    ports:
      - "127.0.0.1:18080:8080"

  backend:
    build:
      context: .
      # Contourne un problème observé sur certains hôtes Windows/WSL2 : le pont réseau
      # virtuel Docker par défaut tronque aléatoirement les téléchargements Maven lors
      # du build ("Premature end of Content-Length"). --network=host lors du build
      # utilise directement la pile réseau de l'hôte et évite le problème.
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agenda_cge}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD requis dans .env}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET requis dans .env}
      # Vu du navigateur, les jetons Keycloak portent iss = domaine public ; le backend
      # peut en revanche interroger Keycloak directement via le réseau Docker interne.
      KEYCLOAK_ISSUER_URI: https://${KEYCLOAK_HOSTNAME:-auth.asce-lc.bf}/realms/asce-lc-realm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/asce-lc-realm/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump
      PG_RESTORE_PATH: /usr/lib/postgresql/18/bin/pg_restore
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    ports:
      - "127.0.0.1:18081:8081"

  frontend:
    build:
      context: ../../Font/cge-agenda_front
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:18040:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:
